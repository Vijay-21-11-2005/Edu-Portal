<!DOCTYPE html>
<html lang="en">
<head>
    <script src="js/theme.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Teacher | Edu-Portal</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="hidden">
    <main class="wide">
        <h1>Teacher Dashboard</h1>
        <p id="welcome"></p>
        <h2>My Courses</h2>
        <table id="my-courses"></table>
        <h2>AI Quiz Generator</h2>
        <select id="quiz-course"></select>
        <input id="quiz-topic" placeholder="Topic">
        <input id="quiz-count" type="number" min="1" max="10" value="5">
        <button id="gen-btn">Generate</button>
        <div id="quiz-preview"></div>
        <button id="save-btn" class="hidden">Save quiz</button>
        <h2>Student Results</h2>
        <table id="results"></table>
        <button onclick="logout()">Logout</button>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/guard.js"></script>
    <script src="js/teacher.js"></script>
    <script>guard("teacher").then(() => { loadTeacherCourses(); loadQuizCourses(); loadResults(); });</script>
</body>
</html>
